name: Phase 3F Format

on:
  push:
    branches:
      - feat/phase3f-gridstack-dashboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase3f-gridstack-dashboard
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/\(dashboard\)/dashboard/page.tsx \
            src/app/api/dashboard/layout/route.ts \
            src/components/dashboard/gridstack-dashboard.tsx \
            src/lib/dashboard/layout.ts \
            src/lib/dashboard/layout.test.ts
          git commit -m "style(dashboard): apply project formatting"
          git push origin HEAD:feat/phase3f-gridstack-dashboard

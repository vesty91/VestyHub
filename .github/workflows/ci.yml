name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      APP_NAME: VestyHub
      APP_URL: http://127.0.0.1:3000
      APP_PORT: "3000"
      APP_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DATABASE_URL: postgresql://vestyhub:vestyhub@127.0.0.1:5432/vestyhub
      AUTH_LOCAL_ENABLED: "true"
      AUTHENTIK_ENABLED: "false"
      DOCKER_CONTROL_ENABLED: "false"
      DOCKER_LOGS_ENABLED: "true"
      SYNOLOGY_ENABLED: "false"
      SYNOLOGY_VERIFY_TLS: "true"
      DEMO_MODE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  deployment_sanity:
    name: NAS deployment manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      APP_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      POSTGRES_PASSWORD: ci-only-dummy-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configs and deployment script
        shell: bash
        run: |
          cp .env.example .env
          docker compose --project-directory "$PWD" -f docker-compose.yml -f docker-compose.override.yml config --quiet
          docker compose --project-directory "$PWD" -f deploy/nas/compose.production.yml config --quiet
          sh -n deploy/nas/deploy-production.sh
          docker compose --env-file .env.example -f compose.local.yml config --quiet

  e2e:
    name: Playwright desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vestyhub
          POSTGRES_PASSWORD: ci-only-dummy-password
          POSTGRES_DB: vestyhub_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vestyhub -d vestyhub_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: production
      APP_NAME: VestyHub CI
      APP_URL: http://127.0.0.1:3000
      APP_PORT: "3000"
      APP_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DATABASE_URL: postgresql://vestyhub:ci-only-dummy-password@127.0.0.1:5432/vestyhub_e2e
      AUTH_LOCAL_ENABLED: "true"
      AUTHENTIK_ENABLED: "false"
      DOCKER_CONTROL_ENABLED: "false"
      DOCKER_LOGS_ENABLED: "false"
      SYNOLOGY_ENABLED: "false"
      SYNOLOGY_VERIFY_TLS: "true"
      DEMO_MODE: "false"
      SEED_ADMIN_EMAIL: e2e-admin@vestyhub.local
      SEED_ADMIN_PASSWORD: ci-only-strong-admin-password
      E2E_ADMIN_EMAIL: e2e-admin@vestyhub.local
      E2E_ADMIN_PASSWORD: ci-only-strong-admin-password
      E2E_RBAC_SEED: "1"
      E2E_USER_PASSWORD: ci-only-user-password-strong
      E2E_VIEWER_PASSWORD: ci-only-viewer-password-strong
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Seed disposable role-isolation fixtures
        run: pnpm exec tsx scripts/ci-seed-rbac.ts
      - run: pnpm build
      - run: pnpm test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  backup_restore_drill:
    name: PostgreSQL isolated backup/restore
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vestyhub_ci
          POSTGRES_PASSWORD: ci-only-dummy-password
          POSTGRES_DB: vestyhub_backup_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vestyhub_ci -d vestyhub_backup_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      BACKUP_DRILL_ONLY: "1"
      NODE_ENV: test
      APP_NAME: VestyHub Backup CI
      APP_URL: http://127.0.0.1:3000
      APP_PORT: "3000"
      APP_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DATABASE_URL: postgresql://vestyhub_ci:ci-only-dummy-password@127.0.0.1:5433/vestyhub_backup_ci
      PGHOST: 127.0.0.1
      PGPORT: "5433"
      PGUSER: vestyhub_ci
      PGDATABASE: vestyhub_backup_ci
      POSTGRES_PASSWORD: ci-only-dummy-password
      AUTH_LOCAL_ENABLED: "true"
      AUTHENTIK_ENABLED: "false"
      DOCKER_CONTROL_ENABLED: "false"
      DOCKER_LOGS_ENABLED: "false"
      SYNOLOGY_ENABLED: "false"
      SYNOLOGY_VERIFY_TLS: "true"
      DEMO_MODE: "false"
      SEED_ADMIN_EMAIL: backup-ci@vestyhub.local
      SEED_ADMIN_PASSWORD: ci-only-backup-restore-password

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Verify PostgreSQL logical backup and isolated restore
        shell: bash
        run: bash scripts/ci-backup-restore-drill.sh
      - name: Verify real PostgreSQL outage and recovery on disposable Docker
        run: pnpm exec tsx scripts/test-postgres-outage.ts

name: Dependency security audit

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Runtime dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependency graph
        id: audit
        shell: bash
        run: |
          set +e
          pnpm audit --prod --audit-level high > dependency-audit.txt 2>&1
          status=$?
          set -e
          {
            echo "## Production dependency audit"
            echo
            echo "Command: \`pnpm audit --prod --audit-level high\`"
            echo
            echo "Exit status: **$status**"
            echo
            echo "This is a report-only check. Review findings and decide on tested patches before making it blocking."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::Production dependency audit reported findings or an audit-service error. Inspect the attached report; this job is informational."
          fi
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: dependency-audit.txt
          if-no-files-found: warn
          retention-days: 14

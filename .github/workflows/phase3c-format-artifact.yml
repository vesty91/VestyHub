name: Phase 3C formatting helper

on:
  push:
    branches:
      - feat/phase3c-monitoring-observability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase3c-monitoring-observability
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example src/app/api/monitoring 'src/app/(dashboard)/monitoring' src/components/monitoring src/connectors/monitoring src/lib/monitoring
          git commit -m "style(monitoring): format phase 3c implementation"
          git push origin HEAD:feat/phase3c-monitoring-observability

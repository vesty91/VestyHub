global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: vestyhub

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: snmp-exporter
    static_configs:
      - targets: ["snmp-exporter:9116"]

  - job_name: synology-snmp
    scrape_interval: 30s
    scrape_timeout: 25s
    metrics_path: /snmp
    params:
      auth: [synology_v3]
      module: [synology]
    static_configs:
      - targets: ["192.168.1.5"]
        labels:
          device: RestorPc
          source: synology-snmp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
